
services:
  qr-payment-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qr-payment-container
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - qr-payment-network

networks:
  qr-payment-network:
    external: true
    name: multi-domain

volumes:
  # Optional: if you want to persist logs
  nginx_logs:
    driver: local
